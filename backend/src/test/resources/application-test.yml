spring:
  datasource:
    url: jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${TEST_DB_NAME:mdreader_test}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

jwt:
  secret: test-only-secret-for-mdreader-integration-tests-0123456789
  expiration-minutes: 60

logging:
  level:
    root: warn
    com.mdreader: warn
    org.springframework.test: warn
