spring:
  application:
    name: mdreader
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MdReaderHikariPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}

logging:
  charset:
    console: UTF-8
    file: UTF-8

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mdreader.entity.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # JWT 签名密钥，至少 32 字节；生产环境必须通过 JWT_SECRET 注入
  secret: ${JWT_SECRET}
  # Token 有效期（分钟）：默认 3 小时；prod profile 覆盖为 7 天
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:180}

app:
  cors:
    # 前后端分离开发允许的前端来源，多个用逗号分隔；生产通过 CORS_ALLOWED_ORIGINS 注入
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    # 头像本地保存目录；生产建议改为持久化磁盘并配置反向代理
    avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
    avatar-url-prefix: /uploads/avatars/
    max-avatar-bytes: 2097152
