# 本地开发配置示例。
# 复制为 application-local.yml 后填写环境变量，不要把真实密码提交到仓库。
# application-local.yml 已被 .gitignore 忽略。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mdreader}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:180}

logging:
  level:
    com.mdreader: debug
    com.mdreader.mapper: debug
